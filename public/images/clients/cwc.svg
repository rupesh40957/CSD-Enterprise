<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Central Water Commission (CWC Delhi) Official Emblem -->
  <circle cx="150" cy="150" r="140" fill="#003865" stroke="#d4af37" stroke-width="6"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Ashoka Emblem Stylized at Top -->
  <g fill="#d4af37" stroke="#d4af37">
    <!-- Top Stupa / Crown -->
    <circle cx="150" cy="85" r="12" />
    <path d="M 140 98 L 160 98 L 156 112 L 144 112 Z" />
    <!-- Three Lions silhouette -->
    <path d="M 125 105 C 130 95, 140 95, 145 105 L 145 125 L 125 125 Z" />
    <path d="M 155 105 C 160 95, 170 95, 175 105 L 175 125 L 155 125 Z" />
    <rect x="120" y="125" width="60" height="6" rx="2" />
  </g>
  
  <!-- Water Waves / Flow Symbolism -->
  <path d="M 60 160 Q 105 140, 150 160 T 240 160" fill="none" stroke="#48cae4" stroke-width="8" stroke-linecap="round"/>
  <path d="M 75 180 Q 112 165, 150 180 T 225 180" fill="none" stroke="#90e0ef" stroke-width="7" stroke-linecap="round"/>
  <path d="M 90 200 Q 120 190, 150 200 T 210 200" fill="none" stroke="#caf0f8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Circular Arc Text -->
  <text x="150" y="58" font-family="'Arial', sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">केन्द्रीय जल आयोग</text>
  <text x="150" y="240" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#d4af37" text-anchor="middle" letter-spacing="1">CENTRAL WATER COMMISSION</text>
  <text x="150" y="260" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEW DELHI</text>
</svg>
