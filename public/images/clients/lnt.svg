  <circle cx="150" cy="150" r="132" fill="none" stroke="#003882" stroke-width="4"/>
  
  <!-- L&T Interlocking Lettermark -->
  <!-- 'L' -->
  <path d="M 68 82 L 98 82 L 98 190 L 148 190 L 148 218 L 68 218 Z" fill="#ffffff"/>
  
  <!-- Ampersand '&' stylized -->
  <path d="M 162 135 C 162 118 152 108 138 108 C 125 108 116 116 116 128 C 116 142 126 150 142 162 C 122 170 112 182 112 196 C 112 212 126 222 144 222 C 165 222 178 208 178 190 C 178 174 168 164 154 152 C 160 148 162 142 162 135 Z M 134 186 C 130 186 128 182 128 178 C 128 172 132 168 140 162 C 145 166 148 172 148 178 C 148 184 142 186 134 186 Z M 136 130 C 134 130 132 128 132 125 C 132 120 135 118 138 118 C 142 118 145 120 145 125 C 145 128 142 130 136 130 Z" fill="#ffffff"/>
  
  <!-- 'T' -->
  <path d="M 165 82 L 235 82 L 235 110 L 214 110 L 214 218 L 186 218 L 186 110 L 165 110 Z" fill="#ffffff"/>
  
  <!-- Subtitle: LARSEN & TOUBRO -->
  <text x="150" y="260" font-family="'Arial Black', sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">L&amp;T</text>
</svg>
