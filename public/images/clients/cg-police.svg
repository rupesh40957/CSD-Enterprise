<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Chhattisgarh State Police Department Official Crest -->
  <!-- Shield Shape -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d" />
      <stop offset="100%" stop-color="#050e24" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 50 40 L 250 40 C 250 140, 240 230, 150 280 C 60 230, 50 140, 50 40 Z" fill="url(#shieldGrad)" stroke="#c59b27" stroke-width="7" />
  <path d="M 62 52 L 238 52 C 238 135, 230 215, 150 260 C 70 215, 62 135, 62 52 Z" fill="none" stroke="#e5c05b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ashoka Stambh Emblem Top -->
  <g fill="#e5c05b" stroke="#e5c05b">
    <path d="M 135 65 L 165 65 L 160 88 L 140 88 Z" />
    <circle cx="150" cy="98" r="8" fill="none" stroke="#e5c05b" stroke-width="2" />
    <rect x="125" y="108" width="50" height="5" rx="1" />
  </g>

  <!-- Crossed Swords / Insignia -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="125" x2="200" y2="185" />
    <line x1="200" y1="125" x2="100" y2="185" />
  </g>
  <!-- Center Star Badge -->
  <polygon points="150,135 156,150 172,150 160,160 164,175 150,166 136,175 140,160 128,150 144,150" fill="#e5c05b" stroke="#c59b27" stroke-width="1.5"/>

  <!-- Ribbon Banner Bottom -->
  <path d="M 40 205 L 85 205 L 150 220 L 215 205 L 260 205 L 250 235 L 215 235 L 150 250 L 85 235 L 50 235 Z" fill="#b91c1c" stroke="#e5c05b" stroke-width="2.5"/>
  <text x="150" y="222" font-family="'Noto Sans', 'Arial', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">छत्तीसगढ़ पुलिस</text>
  <text x="150" y="243" font-family="'Arial Black', sans-serif" font-weight="bold" font-size="9" fill="#e5c05b" text-anchor="middle" letter-spacing="1">CG POLICE</text>
</svg>
