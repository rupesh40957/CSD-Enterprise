<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mgmtBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </radialGradient>
    <filter id="shadowMgmt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="200" cy="200" r="190" fill="url(#mgmtBg)" stroke="#38bdf8" stroke-width="2" filter="url(#shadowMgmt)"/>
  
  <!-- Architectural Window Frames (Background) -->
  <line x1="200" y1="20" x2="200" y2="380" stroke="#0f172a" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="100" y1="30" x2="100" y2="370" stroke="#0f172a" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="300" y1="30" x2="300" y2="370" stroke="#0f172a" stroke-width="4" stroke-opacity="0.6"/>
  
  <line x1="20" y1="180" x2="380" y2="180" stroke="#0f172a" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="40" y1="100" x2="360" y2="100" stroke="#0f172a" stroke-width="3" stroke-opacity="0.5"/>

  <!-- City Skyline subtle silhouette in distance -->
  <rect x="50" y="140" width="30" height="40" fill="#cbd5e1" fill-opacity="0.5"/>
  <rect x="85" y="125" width="20" height="55" fill="#94a3b8" fill-opacity="0.5"/>
  <rect x="295" y="130" width="25" height="50" fill="#94a3b8" fill-opacity="0.5"/>
  <rect x="325" y="145" width="25" height="35" fill="#cbd5e1" fill-opacity="0.5"/>

  <!-- Leadership & Employees Silhouettes Group -->
  <!-- Floor line -->
  <path d="M 30 330 Q 200 345 370 330 L 370 380 Q 200 395 30 380 Z" fill="#0f172a"/>

  <!-- Figure 1 (Left Engineer/Manager in discussion) -->
  <circle cx="105" cy="235" r="14" fill="#090d16"/>
  <path d="M 90 280 L 80 340 L 125 340 L 120 280 C 120 260 90 260 90 280 Z" fill="#090d16"/>
  <path d="M 115 270 L 140 295 L 132 302 L 110 282 Z" fill="#090d16"/> <!-- gesturing arm -->

  <!-- Figure 2 (Executive Left-Center) -->
  <circle cx="160" cy="215" r="15" fill="#090d16"/>
  <path d="M 142 260 L 135 345 L 185 345 L 178 260 C 178 240 142 240 142 260 Z" fill="#090d16"/>

  <!-- Figure 3 (Center Leadership Handshake / Discussion) -->
  <circle cx="215" cy="210" r="16" fill="#090d16"/>
  <path d="M 195 255 L 190 345 L 240 345 L 235 255 C 235 235 195 235 195 255 Z" fill="#090d16"/>
  <path d="M 175 265 L 210 280 L 210 290 L 175 275 Z" fill="#090d16"/>

  <!-- Figure 4 (Executive Right-Center) -->
  <circle cx="265" cy="220" r="15" fill="#090d16"/>
  <path d="M 248 265 L 240 345 L 290 345 L 282 265 C 282 245 248 245 248 265 Z" fill="#090d16"/>

  <!-- Figure 5 (Right Team Member with clipboard/tablet) -->
  <circle cx="315" cy="235" r="14" fill="#090d16"/>
  <path d="M 298 280 L 292 340 L 338 340 L 332 280 C 332 260 298 260 298 280 Z" fill="#090d16"/>
  <rect x="290" y="275" width="14" height="18" rx="2" fill="#38bdf8" transform="rotate(-15 290 275)"/>
</svg>
