<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="valGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#valGrad)" filter="url(#valGlow)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>

  <!-- Glowing Heart in Center -->
  <path d="M 200 155 C 190 135 160 135 150 155 C 135 185 185 220 200 235 C 215 220 265 185 250 155 C 240 135 210 135 200 155 Z" fill="#ffffff" />

  <!-- Left Supporting Hand -->
  <path d="M 125 215 L 145 195 C 150 190 158 190 162 195 L 175 208 C 178 211 178 216 175 219 L 160 234 L 178 220 C 182 217 187 218 190 222 C 193 226 192 231 188 235 L 165 258 L 180 245 C 184 242 189 243 192 247 C 195 251 194 256 190 260 L 165 285 L 140 295 L 105 270 L 115 245 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Right Supporting Hand (Mirrored) -->
  <path d="M 275 215 L 255 195 C 250 190 242 190 238 195 L 225 208 C 222 211 222 216 225 219 L 240 234 L 222 220 C 218 217 213 218 210 222 C 207 226 208 231 212 235 L 235 258 L 220 245 C 216 242 211 243 208 247 C 205 251 206 256 210 260 L 235 285 L 260 295 L 295 270 L 285 245 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Bottom Wrist Base Arc -->
  <path d="M 130 285 C 165 315 235 315 270 285 L 255 305 C 225 330 175 330 145 305 Z" fill="#ffffff" fill-opacity="0.85"/>
</svg>
