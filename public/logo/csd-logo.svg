<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="100%" height="100%">
  <defs>
    <linearGradient id="csdRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sleek Dark Pill Container -->
  <rect x="5" y="5" width="190" height="100" rx="22" fill="#080e1e" stroke="#dc2626" stroke-width="2.8" filter="url(#subtleGlow)"/>

  <!-- Inner Emblem Structure -->
