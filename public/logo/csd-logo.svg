<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%">
  <defs>
    <linearGradient id="csdRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded pill container for emblem -->
  <rect x="4" y="4" width="232" height="112" rx="24" fill="#0b0f19" stroke="#dc2626" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Left Curve 'C' -->
  <path d="M 105 28 C 50 28, 25 42, 25 60 C 25 78, 50 92, 105 92 L 105 76 C 65 76, 47 68, 47 60 C 47 52, 65 44, 105 44 Z" fill="url(#csdRedGrad)" filter="url(#redGlow)" />
  
  <!-- Central Vertical Divider -->
  <rect x="106" y="28" width="16" height="64" rx="3" fill="#ffffff" />
  
  <!-- Diagonal Bar 'S'/'D' bridge -->
  <path d="M 122 46 L 195 76 L 195 90 L 122 60 Z" fill="url(#csdRedGrad)" />
  
  <!-- Right Curve 'D' -->
  <path d="M 122 28 C 175 28, 205 42, 205 60 C 205 78, 175 92, 122 92 L 122 76 C 160 76, 183 68, 183 60 C 183 52, 160 44, 122 44 Z" fill="#ffffff" />
